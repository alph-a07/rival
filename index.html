<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rival</title>

    <meta name="theme-color" id="theme-color-meta" content="#0A0812" />

    <script>
      (() => {
        const theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";

        const manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = `/brand/${theme}/manifest.webmanifest`;

        document.head.appendChild(manifest);
      })();
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/brand/favicon.ico"
      sizes="48x48"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/dark/favicon.svg"
      media="(prefers-color-scheme: dark)"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/light/favicon.svg"
      media="(prefers-color-scheme: light)"
    />

    <link
      rel="apple-touch-icon"
      href="/brand/dark/apple-touch-icon.png"
      media="(prefers-color-scheme: dark)"
    />

    <link
      rel="apple-touch-icon"
      href="/brand/light/apple-touch-icon.png"
      media="(prefers-color-scheme: light)"
    />

    <link rel="mask-icon" href="/brand/safari-pinned-tab.svg" color="#9C90E6" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=clash-display@400,500,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
